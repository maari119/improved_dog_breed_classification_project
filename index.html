<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Dog Breed Classifier</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .animate-fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen flex flex-col items-center py-10 px-4">

    <!-- Header -->
    <div class="text-center mb-10">
        <h1 class="text-4xl md:text-5xl font-extrabold text-slate-800 mb-2">Dog Breed Identifier</h1>
        <p class="text-slate-500">Powered by ResNet50 & PyTorch</p>
    </div>

    <!-- Main Card -->
    <div class="bg-white w-full max-w-4xl rounded-2xl shadow-xl overflow-hidden flex flex-col md:flex-row border border-slate-100">
        
        <!-- Left: Upload Section -->
        <div class="w-full md:w-1/2 p-8 flex flex-col items-center justify-center border-b md:border-b-0 md:border-r border-slate-100">
            
            <!-- Drop Zone -->
            <div id="drop-zone" class="w-full h-64 border-2 border-dashed border-indigo-200 rounded-xl flex flex-col items-center justify-center bg-indigo-50/30 hover:bg-indigo-50 transition-colors cursor-pointer relative group overflow-hidden">
                <input type="file" id="file-input" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10" accept="image/*">
                
                <!-- Placeholder (Hidden when image loaded) -->
                <div id="upload-placeholder" class="text-center p-4 transition-opacity duration-300">
                    <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-8 h-8">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5m-13.5-9L12 3m0 0l4.5 4.5M12 3v13.5" />
                        </svg>
                    </div>
                    <p class="text-slate-700 font-semibold">Click or Drop Image Here</p>
                    <p class="text-slate-400 text-sm mt-1">JPEG, PNG (Max 5MB)</p>
                </div>

                <!-- Preview Image -->
                <img id="preview-image" class="hidden absolute inset-0 w-full h-full object-cover rounded-xl z-0" alt="Preview">
                
                <!-- Remove Button (Visible only when image loaded) -->
                <button id="remove-btn" class="hidden absolute top-2 right-2 z-20 bg-white text-red-500 p-2 rounded-full shadow-md hover:bg-red-50 hover:scale-105 transition-all" title="Remove Image">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor" class="w-5 h-5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <button id="predict-btn" class="mt-6 w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-lg transition-all transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed shadow-lg shadow-indigo-200">
                Identify Breed
            </button>
        </div>

        <!-- Right: Results Section -->
        <div class="w-full md:w-1/2 p-8 bg-slate-50 flex flex-col">
            <h3 class="text-lg font-bold text-slate-800 mb-4">Analysis Results</h3>
            
            <!-- Loading State -->
            <div id="loader" class="hidden flex-1 flex flex-col items-center justify-center text-slate-400">
                <div class="w-10 h-10 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mb-3"></div>
                <p>Analyzing features...</p>
            </div>

            <!-- Empty State -->
            <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-slate-400 text-center">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-12 h-12 mb-3 opacity-50">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09zM18.259 8.715L18 9.75l-.259-1.035a3.375 3.375 0 00-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 002.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 002.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 00-2.456 2.456zM16.894 20.567L16.5 21.75l-.394-1.183a2.25 2.25 0 00-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 001.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 001.423 1.423l1.183.394-1.183.394a2.25 2.25 0 00-1.423 1.423z" />
                </svg>
                <p>Upload an image to see the prediction</p>
            </div>

            <!-- Results Content -->
            <div id="results-content" class="hidden animate-fade-in">
                <div class="bg-white p-4 rounded-xl border border-green-100 bg-green-50/50 mb-6">
                    <p class="text-sm text-slate-500 mb-1">Top Prediction</p>
                    <div class="flex justify-between items-end">
                        <h2 id="top-breed" class="text-2xl font-bold text-indigo-900 leading-none">Golden Retriever</h2>
                        <span id="top-conf" class="text-lg font-bold text-green-600">98.5%</span>
                    </div>
                </div>

                <p class="text-sm font-semibold text-slate-400 uppercase tracking-wider mb-3">Alternative Matches</p>
                <ul id="other-predictions" class="space-y-2">
                    <!-- JS will populate this -->
                </ul>
            </div>
            
            <!-- Error Message -->
            <div id="error-message" class="hidden mt-4 p-3 bg-red-50 text-red-700 text-sm rounded-lg border border-red-100"></div>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const predictBtn = document.getElementById('predict-btn');
        const previewImg = document.getElementById('preview-image');
        const uploadPlaceholder = document.getElementById('upload-placeholder');
        const removeBtn = document.getElementById('remove-btn');
        const loader = document.getElementById('loader');
        const emptyState = document.getElementById('empty-state');
        const resultsContent = document.getElementById('results-content');
        const errorMessage = document.getElementById('error-message');

        let selectedFile = null;

        // Handle File Selection
        fileInput.addEventListener('change', (e) => {
            if (e.target.files && e.target.files[0]) {
                handleFile(e.target.files[0]);
            }
        });

        function handleFile(file) {
            selectedFile = file;
            const reader = new FileReader();
            reader.onload = (e) => {
                previewImg.src = e.target.result;
                previewImg.classList.remove('hidden');
                uploadPlaceholder.classList.add('opacity-0');
                
                // Show remove button and hide file input interaction
                removeBtn.classList.remove('hidden');
                fileInput.disabled = true; // Disable input so clicking image doesn't open dialog
                fileInput.classList.add('hidden'); // Hide input so cursor doesn't show pointer
            }
            reader.readAsDataURL(file);
            
            // Reset UI
            resultsContent.classList.add('hidden');
            emptyState.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        // Handle Remove Image
        removeBtn.addEventListener('click', (e) => {
            e.stopPropagation(); // Prevent triggering the container click if any
            resetUpload();
        });

        function resetUpload() {
            selectedFile = null;
            fileInput.value = ''; // Clear input value
            fileInput.disabled = false;
            fileInput.classList.remove('hidden');
            
            previewImg.src = '';
            previewImg.classList.add('hidden');
            uploadPlaceholder.classList.remove('opacity-0');
            removeBtn.classList.add('hidden');
            
            // Clear results
            resultsContent.classList.add('hidden');
            emptyState.classList.remove('hidden');
            errorMessage.classList.add('hidden');
        }

        // Handle API Call
        predictBtn.addEventListener('click', async () => {
            if (!selectedFile) {
                showError("Please select an image first.");
                return;
            }

            setLoading(true);

            const formData = new FormData();
            formData.append('file', selectedFile);

            try {
                const response = await fetch('http://127.0.0.1:8008/predict', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Server error processing image');

                const data = await response.json();
                displayResults(data);

            } catch (error) {
                showError(error.message + ". Ensure backend is running (uvicorn app:app --reload).");
            } finally {
                setLoading(false);
            }
        });

        function displayResults(data) {
            // Set Top Prediction
            document.getElementById('top-breed').textContent = data.prediction;
            document.getElementById('top-conf').textContent = data.confidence;

            // Set Others
            const list = document.getElementById('other-predictions');
            list.innerHTML = '';
            
            // Skip the first one (it's already shown as main)
            data.top_5.slice(1).forEach(item => {
                const li = document.createElement('li');
                li.className = "flex justify-between items-center p-2 hover:bg-slate-100 rounded-lg transition-colors text-sm";
                li.innerHTML = `
                    <span class="text-slate-700 font-medium">${item.breed}</span>
                    <span class="text-slate-500 font-mono">${item.confidence}</span>
                `;
                list.appendChild(li);
            });

            emptyState.classList.add('hidden');
            resultsContent.classList.remove('hidden');
        }

        function setLoading(isLoading) {
            predictBtn.disabled = isLoading;
            predictBtn.textContent = isLoading ? 'Processing...' : 'Identify Breed';
            
            if (isLoading) {
                loader.classList.remove('hidden');
                emptyState.classList.add('hidden');
                resultsContent.classList.add('hidden');
                errorMessage.classList.add('hidden');
            } else {
                loader.classList.add('hidden');
            }
        }

        function showError(msg) {
            errorMessage.textContent = msg;
            errorMessage.classList.remove('hidden');
        }
    </script>
</body>
</html>
